<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Koneat Lite - Cadastro</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* DETALHES DE LINHAS BRANCAS LUMINOSAS NOS CANTOS (IGUAL AO LOGIN) */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            pointer-events: none;
            opacity: 0.25;
        }

        body::before {
            top: -100px;
            left: -100px;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            border-bottom-right-radius: 100%;
            box-shadow: inset -1px -1px 2px rgba(255,255,255,0.3);
        }

        body::after {
            bottom: -100px;
            right: -100px;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            border-top-left-radius: 100%;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.3);
        }

        .app-screen {
            width: 100%;
            max-width: 390px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 24px 44px 24px;
            position: relative;
            z-index: 1;
            gap: 20px;
        }

        /* TÍTULO COM ESPAÇAMENTO EQUILIBRADO */
        .logo-area {
            text-align: center;
            margin-bottom: 16px;
        }

        .logo-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #ffffff;
            margin: 0;
            text-transform: uppercase;
        }
        
        .form-container {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .input-group {
            width: 100%;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 13px;
            font-weight: 400;
            color: #ffffff;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.35); /* Borda visível e padronizada */
            border-radius: 23px;
            display: flex;
            align-items: center;
            padding: 0 16px;
        }

        .input-wrapper:focus-within {
            border-color: #ffffff;
        }

        .input-field {
            width: 100%;
            background: none;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: #8e8e93;
        }

        /* BOTÃO OLHO */
        .toggle-password {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8e8e93;
            transition: color 0.2s ease;
        }

        .toggle-password:hover, .toggle-password:active {
            color: #ffffff;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        .btn-submit {
            width: 100%;
            height: 46px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 23px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 34px; /* Espaço amplo idêntico ao login */
            letter-spacing: 0.5px;
        }

        .footer-area {
            text-align: center;
            margin-top: 8px;
        }

        .footer-link {
            color: #8e8e93;
            text-decoration: underline;
            text-underline-offset: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .footer-link:hover, .footer-link:active {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <div class="logo-area">
            <h1 class="logo-title">CRIE SUA CONTA</h1>
        </div>

        <div class="form-container">
            <form id="signupForm">
                <div class="input-group">
                    <label class="input-label" for="usernameField">Nome de usuário</label>
                    <div class="input-wrapper">
                        <input type="text" id="usernameField" class="input-field" placeholder="Digite seu @usuario" required autocomplete="username">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="emailField">E-mail</label>
                    <div class="input-wrapper">
                        <input type="email" id="emailField" class="input-field" placeholder="Digite seu e-mail" required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="passwordField">Senha</label>
                    <div class="input-wrapper">
                        <!-- Começa como texto para o olhinho ficar aberto sem o traço inicialmente -->
                        <input type="text" id="passwordField" class="input-field" placeholder="Digite sua senha" required autocomplete="new-password">
                        <button type="button" class="toggle-password" id="togglePassBtn" aria-label="Alternar senha">
                            <!-- SVG do Olho Aberto (Sem o traço por padrão) -->
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">CONTINUAR</button>
            </form>
        </div>

        <div class="footer-area">
            <a class="footer-link" id="btnLoginRedirect">Já tem conta? Voltar ao Login</a>
        </div>
    </div>

    <script>
        /* ===============================================================
           LÓGICA INTELIGENTE DO CAMPO DE SENHA E OLHO
           =============================================================== */
        const passwordField = document.getElementById('passwordField');
        const togglePassBtn = document.getElementById('togglePassBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        const openEyeSVG = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        const closedEyeSVG = `<line x1="1" y1="1" x2="23" y2="23"></line><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>`;

        let userManuallyToggled = false;

        passwordField.addEventListener('input', () => {
            if (passwordField.value.length > 0 && !userManuallyToggled) {
                passwordField.setAttribute('type', 'password');
                eyeIcon.innerHTML = closedEyeSVG;
            } else if (passwordField.value.length === 0) {
                userManuallyToggled = false;
                passwordField.setAttribute('type', 'text');
                eyeIcon.innerHTML = openEyeSVG;
            }
        });

        togglePassBtn.addEventListener('click', () => {
            userManuallyToggled = true;
            const isPassword = passwordField.getAttribute('type') === 'password';
            passwordField.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.innerHTML = isPassword ? openEyeSVG : closedEyeSVG;
        });

        // Formata username automaticamente em letras minúsculas
        const usernameField = document.getElementById('usernameField');
        usernameField.addEventListener('input', (e) => {
            e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9._]/g, '');
        });

        /* ===============================================================
           EVENTOS DE SUBMISSÃO E NAVEGAÇÃO
           =============================================================== */
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameField.value.trim();
            const email = document.getElementById('emailField').value.trim();
            const password = passwordField.value;

            if (!username || !email || !password) {
                alert('Preencha todos os campos.');
                return;
            }

            window.location.href = 'passo1.html';
        });

        document.getElementById('btnLoginRedirect').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
  </html>
