<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneat - Mensagens</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .messages-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            position: relative;
        }

        /* Cabeçalho */
        .messages-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
        }

        .header-user-title {
            font-size: 17px;
            font-weight: 700;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            text-decoration: none;
        }

        /* Barra de Pesquisa */
        .search-section {
            padding: 12px 16px;
            background: #ffffff;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box svg {
            position: absolute;
            left: 14px;
            stroke: #8e8e93;
        }

        .search-input-msg {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 20px;
            border: 1px solid #dbdbdb;
            background: #fafafa;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        /* Abas Superiores (2 Abas: Conversas / Solicitações) */
        .tabs-messages {
            display: flex;
            border-bottom: 1px solid #efefef;
            background: #ffffff;
            position: relative;
        }

        .tab-msg-btn {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #8e8e93;
            cursor: pointer;
            transition: color 0.2s;
        }

        .tab-msg-btn.active {
            color: #000000;
            font-weight: 700;
        }

        /* Barrinha Preta Deslizante */
        .tab-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            background: #000000;
            transition: transform 0.25s ease, width 0.25s ease;
        }

        /* Área de Conteúdo / Estados Vazios */
        .tab-content-area {
            flex: 1;
            position: relative;
            overflow-y: auto;
        }

        .tab-pane {
            display: none;
            padding: 80px 20px;
            text-align: center;
            color: #8e8e93;
            font-size: 14px;
        }

        .tab-pane.active {
            display: block;
        }

        /* Estilo do item de conversa quando houver chats ativos */
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s;
        }

        .chat-item:active {
            background: #f8f8f8;
        }

        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
        }

        .chat-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .chat-name {
            font-size: 14px;
            font-weight: 700;
            color: #000000;
        }

        .chat-preview {
            font-size: 13px;
            color: #8e8e93;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body class="light-theme">

    <div class="messages-container">
        <!-- Header -->
        <header class="messages-header">
            <a href="./passo1.html" class="icon-btn" aria-label="Voltar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </a>
            <span class="header-user-title" id="headerCurrentUsername">@koneat_user</span>
            <button class="icon-btn" aria-label="Nova Mensagem">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            </button>
        </header>

        <!-- Barra de Pesquisa -->
        <div class="search-section">
            <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-input-msg" placeholder="Pesquisar">
            </div>
        </div>

        <!-- Abas: Conversas / Solicitações -->
        <div class="tabs-messages" id="tabsContainer">
            <button class="tab-msg-btn active" onclick="switchMsgTab(0, 'pane-conversas')">Conversas</button>
            <button class="tab-msg-btn" onclick="switchMsgTab(1, 'pane-solicitacoes')">Solicitações</button>
            <div class="tab-indicator" id="tabIndicator"></div>
        </div>

        <!-- Área de Conteúdo -->
        <div class="tab-content-area">
            <!-- Aba 1: Conversas -->
            <div id="pane-conversas" class="tab-pane active">
                <!-- Se houver chat com o KONEAT, linka direto para o chat.html -->
                <a href="./chat.html" class="chat-item">
                    <div class="chat-avatar">K</div>
                    <div class="chat-info">
                        <span class="chat-name">KONEAT</span>
                        <span class="chat-preview">Sempre por aqui! 🤝 Equipe KONEAT.</span>
                    </div>
                </a>
                
                <!-- Exemplo de Estado Vazio (caso queira ocultar o chat acima no JS no futuro) -->
                <!-- <div style="padding-top: 60px;">Nada de atividades pessoais ainda.</div> -->
            </div>

            <!-- Aba 2: Solicitações -->
            <div id="pane-solicitacoes" class="tab-pane">
                Nenhuma solicitação de mensagem no momento.
            </div>
        </div>
    </div>

    <script>
        // Lógica da barrinha preta deslizante
        function switchMsgTab(index, paneId) {
            const buttons = document.querySelectorAll('.tab-msg-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttons[index].classList.add('active');

            const panes = document.querySelectorAll('.tab-pane');
            panes.forEach(pane => pane.classList.remove('active'));
            document.getElementById(paneId).classList.add('active');

            // Reposiciona a barrinha preta
            const indicator = document.getElementById('tabIndicator');
            const targetBtn = buttons[index];
            indicator.style.width = targetBtn.offsetWidth + 'px';
            indicator.style.transform = `translateX(${targetBtn.offsetLeft}px)`;
        }

        // Ajusta a barrinha ao carregar a página
        window.addEventListener('load', () => {
            const activeBtn = document.querySelector('.tab-msg-btn.active');
            const indicator = document.getElementById('tabIndicator');
            indicator.style.width = activeBtn.offsetWidth + 'px';
            indicator.style.transform = `translateX(${activeBtn.offsetLeft}px)`;

            // Carrega a tag do utilizador dinamicamente se existir no localStorage
            const savedUser = localStorage.getItem('koneat_user_tag');
            if(savedUser) {
                document.getElementById('headerCurrentUsername').textContent = savedUser;
            }
        });
    </script>
</body>
</html>
