<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONEAT - Chat</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.chat-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    background: #fff;
    overflow: hidden;
}

/* CABEÇALHO */

.chat-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #fff;
    min-height: 76px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.user-info-header {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar-chat {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 800;
}

.user-titles {
    display: flex;
    flex-direction: column;
}

.name-row {
    display: flex;
    align-items: center;
    gap: 5px;
}

.user-name-title {
    font-size: 15px;
    font-weight: 800;
    color: #000;
}

.status-sub {
    font-size: 12px;
    color: #8e8e93;
}

.header-actions-chat {
    display: flex;
    align-items: center;
    gap: 20px;
}

.icon-action-btn {
    border: none;
    background: none;
    padding: 2px;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
}

/* ÁREA DAS MENSAGENS COM RESERVA PARA NÃO COBRIR */

.chat-messages {
    flex: 1;
    min-height: 0;
    padding: 16px;
    padding-bottom: 100px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #fff;
}

.empty-chat-msg {
    color: #8e8e93;
    font-size: 15px;
    text-align: center;
}

/* RODAPÉ REALMENTE NO LIMITE INFERIOR DA TELA */

.chat-input-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 100%;
    max-width: 480px;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 0 20px;
    margin: 0;

    background: #fff;
    z-index: 100;
}

/* CARD CINZA */

.input-wrapper {
    width: 100%;
    min-height: 68px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 6px 12px;
    gap: 8px;

    margin: 0;
    border-radius: 40px;
    background: #f1f1f3;
}

/* ÍCONES */

.btn-input-icon {
    width: 30px;
    height: 38px;
    flex-shrink: 0;
    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    background: transparent;
    color: #000;
    cursor: pointer;
}

.btn-input-icon svg {
    width: 20px;
    height: 30px;
    display: block;
}

/* CÂMERA PRETA */

.camera-icon {
    width: 36px;
    height: 38px;
}

.camera-icon svg {
    width: 30px;
    height: 30px;
}

/* CAMPO DE MENSAGEM */

.message-input {
    flex: 1;
    min-width: 0;
    height: 40px;

    border: none;
    outline: none;
    background: transparent;

    font-size: 15px;
    color: #000;
    padding: 0;
}

.message-input::placeholder {
    color: #898991;
    opacity: 1;
}

/* ÍCONES DA DIREITA */

.input-actions-right {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    flex-shrink: 0;
}

/* TELAS PEQUENAS */

@media (max-width: 360px) {

    .chat-input-bar {
        padding-left: 12px;
        padding-right: 12px;
    }

    .input-wrapper {
        gap: 7px;
        padding: 6px 10px;
        min-height: 66px;
    }

    .input-actions-right {
        gap: 5px;
    }

    .btn-input-icon {
        width: 30px;
    }

    .btn-input-icon svg {
        width: 20px;
        height: 30px;
    }

    .camera-icon {
        width: 36px;
    }

    .camera-icon svg {
        width: 30px;
        height: 30px;
    }
}

</style>
</head>

<body>

<div class="chat-container">

    <!-- CABEÇALHO -->

    <header class="chat-header">

        <div class="header-left">

            <a href="./mensagens.html"
               class="icon-action-btn"
               aria-label="Voltar">

                <svg width="25" height="25"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2.7"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>

            </a>

            <div class="user-info-header">

                <div class="avatar-chat">K</div>

                <div class="user-titles">

                    <div class="name-row">

                        <span class="user-name-title">
                            KONEAT
                        </span>

                        <svg width="15" height="15"
                             viewBox="0 0 24 24"
                             fill="#0095f6">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>

                    </div>

                    <span class="status-sub">
                        Online há 2 h
                    </span>

                </div>

            </div>
        </div>

        <div class="header-actions-chat">

            <!-- TELEFONE -->

            <button class="icon-action-btn"
                    aria-label="Chamada de voz">

                <svg width="30" height="30"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                    19.79 19.79 0 0 1-8.63-3.07
                    19.5 19.5 0 0 1-6-6
                    19.79 19.79 0 0 1-3.07-8.67
                    A2 2 0 0 1 4.11 2h3
                    a2 2 0 0 1 2 1.72
                    12.84 12.84 0 0 0 .7 2.81
                    2 2 0 0 1-.45 2.11L8.09 9.91
                    a16 16 0 0 0 6 6l1.27-1.27
                    a2 2 0 0 1 2.11-.45
                    12.84 12.84 0 0 0 2.81.7
                    A2 2 0 0 1 22 16.92z"/>
                </svg>

            </button>

            <!-- VÍDEO -->

            <button class="icon-action-btn"
                    aria-label="Chamada de vídeo">

                <svg width="32" height="30"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <rect x="2" y="5" width="14"
                          height="14" rx="2"/>
                    <path d="M16 10l6-4v12l-6-4"/>
                </svg>

            </button>

            <!-- INFORMAÇÕES -->

            <button class="icon-action-btn"
                    aria-label="Informações">

                <svg width="30" height="30"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 16v-4"/>
                    <path d="M12 8h.01"/>
                </svg>

            </button>

        </div>
    </header>

    <!-- ÁREA DA CONVERSA -->

    <main class="chat-messages" id="chatMessages">

        <div class="empty-chat-msg">
            Suas mensagens aparecerão aqui.
        </div>

    </main>

    <!-- RODAPÉ PADRÃO KONEAT -->

    <footer class="chat-input-bar">

        <div class="input-wrapper">

            <!-- CÂMERA -->

            <button class="btn-input-icon camera-icon"
                    aria-label="Câmera">

                <svg viewBox="0 0 40 40"
                     xmlns="http://www.w3.org/2000/svg">

                    <path fill="#000"
                    d="M13 5h14l3 4h4
                    c2.2 0 4 1.8 4 4v18
                    c0 2.2-1.8 4-4 4H6
                    c-2.2 0-4-1.8-4-4V13
                    c0-2.2 1.8-4 4-4h4z"/>

                    <circle cx="20" cy="21"
                            r="9" fill="#fff"/>

                    <circle cx="20" cy="21"
                            r="5.5" fill="#000"/>

                </svg>

            </button>

            <!-- CAMPO DE MENSAGEM -->

            <input
                type="text"
                class="message-input"
                placeholder="Mensagem..."
                aria-label="Escrever mensagem"
            >

            <div class="input-actions-right">

                <!-- ENCAMINHAR -->

                <button class="btn-input-icon"
                        aria-label="Encaminhar">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.9"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M22 2L11 13"/>
                        <path d="M22 2L15 22l-4-9-9-4z"/>

                    </svg>

                </button>

                <!-- ÁUDIO -->

                <button class="btn-input-icon"
                        aria-label="Gravar áudio">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.9"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <rect x="9" y="2" width="6"
                              height="13" rx="3"/>

                        <path d="M5 11a7 7 0 0 0 14 0"/>
                        <path d="M12 18v4"/>
                        <path d="M8 22h8"/>

                    </svg>

                </button>

                <!-- GALERIA -->

                <button class="btn-input-icon"
                        aria-label="Galeria">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.9"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <rect x="2.5" y="2.5"
                              width="19" height="19"
                              rx="3.5"/>

                        <circle cx="8" cy="8"
                                r="1.5"/>

                        <path d="M21.5 15l-6-6L5 19.5"/>

                    </svg>

                </button>

            </div>

        </div>

    </footer>

</div>

</body>
</html>
