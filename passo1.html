<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneat - Perfil</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body { margin:0; padding:0; width:100%; overflow-x:hidden; background:#fff; }
        .bottom-nav-fixed{position:fixed;bottom:0;left:0;right:0;width:100%;height:62px;background:#121214;border-top-left-radius:20px;border-top-right-radius:20px;display:flex;align-items:center;justify-content:space-around;z-index:999;box-sizing:border-box;padding:0 10px}
        .nav-link{background:none;border:none;cursor:pointer;color:#8e8e93;display:flex;align-items:center;justify-content:center;text-decoration:none;width:48px;height:48px}
        .profile-active-circle{width:32px;height:32px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
        .profile-active-circle svg{stroke:#8e8e93}
        .posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px 0 80px 0;width:100%}
        .post-grid-item{position:relative;width:100%;aspect-ratio:1/1;background:#222;overflow:hidden;cursor:pointer}
        .post-grid-item img,.post-grid-item video{width:100%;height:100%;object-fit:cover}
        .post-grid-item .badge-video{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.6);padding:3px;border-radius:4px;display:flex;z-index:2}
        .btn-delete-post{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.7);border:none;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;transition:background 0.2s,transform 0.15s}
        .btn-delete-post:hover{background:rgba(231,76,60,0.9)}
        .btn-delete-post:active{transform:scale(0.9)}
        .badge-formato{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.6);color:#fff;font-size:9px;padding:2px 5px;border-radius:3px}
    </style>
</head>
<body class="light-theme">
    <div class="app-container" style="padding-bottom:70px;">
        <header class="profile-header">
            <div class="header-logo" id="headerUsername" style="text-transform:lowercase;font-size:20px;font-weight:700;letter-spacing:-0.5px;">koneat_user</div>
            <div class="header-actions">
                <button class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></button>
                <div class="dropdown-wrapper">
                    <button class="icon-btn" id="menuBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="./configuracoes.html" class="dropdown-item">Configurações</a>
                        <a href="./privacidade.html" class="dropdown-item">Privacidade</a>
                        <a href="./termos.html" class="dropdown-item">Termos</a>
                    </div>
                </div>
            </div>
        </header>
        <section class="profile-top-layout">
            <div class="avatar-container">
                <div class="avatar-circle"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.3"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
                <button class="camera-btn"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></button>
            </div>
            <div class="stats-bar-inline">
                <div class="stat-item"><span class="stat-number" id="postsCount">0</span><span class="stat-label">posts</span></div>
                <div class="stat-item"><span class="stat-number">0</span><span class="stat-label">seguidores</span></div>
                <div class="stat-item"><span class="stat-number">0</span><span class="stat-label">seguindo</span></div>
            </div>
        </section>
        <section class="user-details-block">
            <h1 class="user-name" id="profileName">Koneat User</h1>
            <p class="user-tag" id="profileTag">@koneat_user</p>
            <p class="user-bio" id="profileBio"></p>
        </section>
        <section class="action-buttons">
            <a href="./editar-perfil.html" class="btn-secondary">Editar perfil</a>
            <button class="btn-secondary">Compartilhar perfil</button>
        </section>
        <nav class="content-tabs">
            <button class="tab-btn active" data-tab="todos"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Todos</span></button>
            <button class="tab-btn" data-tab="virais"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg><span>Virais</span></button>
            <button class="tab-btn" data-tab="geral"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="12" cy="10" r="3"></circle><path d="M7 18c0-2.5 2.2-4.2 5-4.2s5 1.7 5 4.2"></path></svg><span>Geral</span></button>
        </nav>
        <section class="feed-empty-state" id="emptyState">
            <div class="empty-icon-wrapper"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.3"><circle cx="8.5" cy="8.5" r="3"></circle><path d="M3.5 18c0-2.5 2.2-4 5-4s5 1.5 5 4"></path><circle cx="15.5" cy="8.5" r="3"></circle><path d="M15.5 14c2.8 0 5 1.5 5 4"></path></svg></div>
            <h2 class="empty-title">Capture o momento com um amigo</h2>
            <a href="./criar.html" class="btn-create-post" style="text-decoration:none;display:inline-block;">Crie seu primeiro post</a>
        </section>
        <div class="posts-grid" id="userPostsGrid" style="display:none;"></div>
        <div id="profileGrid" style="display:none;"></div>
    </div>
    <nav class="bottom-nav-fixed">
        <a href="./home.html" class="nav-link"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>
        <a href="./criar.html" class="nav-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></a>
        <a href="./passo2.html" class="nav-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="18" rx="4"></rect><polygon points="10 8 16 12 10 16 10 8"></polygon></svg></a>
        <a href="./passo1.html" class="nav-link"><div class="profile-active-circle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div></a>
    </nav>
    <script src="js/app.js"></script>
    <script>
        function getUnifiedPosts(){
            const old1=JSON.parse(localStorage.getItem('koneat_user_posts')||'[]');
            const old2=JSON.parse(localStorage.getItem('koneat_virais_feed')||'[]');
            const novo=JSON.parse(localStorage.getItem('koneat_videos')||'[]');
            let all=[...novo];
            old1.forEach(p=>{ if(!all.find(a=>a.id===p.id)) all.push({id:p.id, src:p.url||p.src, tipo:p.tipo||'geral', formato:p.formato||'1:1', username:localStorage.getItem('koneat_username')||'user'}) });
            old2.forEach(p=>{ if(!all.find(a=>a.id===p.id)) all.push({id:p.id, src:p.url||p.src, tipo:'viral', formato:p.formato||'9:16', username:p.author||'user'}) });
            return all;
        }

        function renderUserPosts(filter='todos'){
            const userPosts=getUnifiedPosts();
            const postsGrid=document.getElementById('userPostsGrid');
            const emptyState=document.getElementById('emptyState');
            const postsCount=document.getElementById('postsCount');
            let filtered=userPosts;
            if(filter==='virais') filtered=userPosts.filter(p=>p.tipo==='viral');
            if(filter==='geral') filtered=userPosts.filter(p=>p.tipo==='geral');

            postsCount.textContent=userPosts.length;
            if(filtered.length===0 && filter==='todos'){
                emptyState.style.display='flex';
                postsGrid.style.display='none';
                postsGrid.innerHTML='';
            }else{
                emptyState.style.display='none';
                postsGrid.style.display='grid';
                postsGrid.innerHTML=filtered.map(post=>{
                    const isVideo=true;
                    return `<div class="post-grid-item" data-id="${post.id}">
                        <button type="button" class="btn-delete-post" onclick="deletePost('${post.id}')" title="Excluir"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                        <video src="${post.src}" muted playsinline></video>
                        <div class="badge-video"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div>
                        <div class="badge-formato">${post.formato||'9:16'} ${post.tipo==='viral'?'🔥':''}</div>
                    </div>`;
                }).join('');
            }
        }

        function deletePost(postId){
            if(!confirm('Deseja realmente excluir esta publicação?')) return;
            let novo=JSON.parse(localStorage.getItem('koneat_videos')||'[]');
            novo=novo.filter(p=>p.id!=postId && p.id!==postId);
            localStorage.setItem('koneat_videos', JSON.stringify(novo));
            let userPosts=JSON.parse(localStorage.getItem('koneat_user_posts')||'[]');
            userPosts=userPosts.filter(p=>p.id!=postId);
            localStorage.setItem('koneat_user_posts', JSON.stringify(userPosts));
            let viraisFeed=JSON.parse(localStorage.getItem('koneat_virais_feed')||'[]');
            viraisFeed=viraisFeed.filter(v=>v.id!=postId);
            localStorage.setItem('koneat_virais_feed', JSON.stringify(viraisFeed));
            renderUserPosts(document.querySelector('.tab-btn.active')?.dataset.tab||'todos');
        }

        document.querySelectorAll('.tab-btn').forEach(btn=>{
            btn.addEventListener('click',()=>{
                document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                renderUserPosts(btn.dataset.tab);
            });
        });

        renderUserPosts();
    </script>
</body>
    </html>
