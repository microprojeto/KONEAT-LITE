<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koneat - Perfil</title>
<link rel="stylesheet" href="css/style.css">
<style>
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;background:#fff}
.bottom-nav-fixed{position:fixed;bottom:0;left:0;right:0;width:100%;height:62px;background:#121214;border-top-left-radius:20px;border-top-right-radius:20px;display:flex;align-items:center;justify-content:space-around;z-index:999;box-sizing:border-box;padding:0 10px}
.nav-link{background:none;border:none;cursor:pointer;color:#8e8e93;display:flex;align-items:center;justify-content:center;text-decoration:none;width:48px;height:48px}
.profile-active-circle{width:32px;height:32px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px 0 80px 0;width:100%}
.post-grid-item{position:relative;width:100%;aspect-ratio:1/1;background:#222;overflow:hidden;cursor:pointer}
.post-grid-item img,.post-grid-item video{width:100%;height:100%;object-fit:cover;display:block}
.btn-delete-post{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.7);border:none;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10}
.badge-formato{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.6);color:#fff;font-size:9px;padding:2px 5px;border-radius:3px}
#videoModal{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column}
</style>
</head>
<body class="light-theme">
<div class="app-container" style="padding-bottom:70px;">
<header class="profile-header"><div id="headerUsername" style="font-size:20px;font-weight:700">koneat_user</div><button id="menuBtn">⋮</button></header>
<section class="profile-top-layout"><div style="width:80px;height:80px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center">◉</div><span id="postsCount">0</span> posts</section>
<nav class="content-tabs"><button class="tab-btn active" data-tab="todos">Todos</button><button class="tab-btn" data-tab="virais">Virais</button><button class="tab-btn" data-tab="geral">Geral</button></nav>
<section id="emptyState"><h2>Capture o momento</h2><a href="./criar.html">Crie seu primeiro post</a></section>
<div class="posts-grid" id="userPostsGrid" style="display:none"></div>
</div>
<div id="videoModal"><button onclick="closeModal()" style="position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.2);border:none;color:#fff;width:40px;height:40px;border-radius:50%">X</button><video id="modalVideo" controls autoplay playsinline style="width:100%;height:80vh;object-fit:contain"></video><img id="modalImage" style="width:100%;height:80vh;object-fit:contain;display:none"><p id="modalCaption" style="color:#fff;padding:16px"></p></div>
<nav class="bottom-nav-fixed"><a href="./home.html" class="nav-link">⌂</a><a href="./criar.html" class="nav-link">+</a><a href="./passo2.html" class="nav-link">▶</a><a href="./passo1.html" class="nav-link"><div class="profile-active-circle">◉</div></a></nav>
<script>
let allVideosCache=[];
function closeModal(){ document.getElementById('videoModal').style.display='none'; document.getElementById('modalVideo').pause(); }
function carregarDoDB(cb){ const req=indexedDB.open('KoneatDB',1); req.onupgradeneeded=(e)=>{ if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id'}); }; req.onsuccess=(e)=>{ const db=e.target.result; if(!db.objectStoreNames.contains('videos')){ cb([]); return; } const tx=db.transaction('videos','readonly'); const getAll=tx.objectStore('videos').getAll(); getAll.onsuccess=()=>{ const lista=getAll.result.map(v=>{ try{ return {id:v.id, file:v.file, src:URL.createObjectURL(v.file), isVideo:v.file.type.startsWith('video'), tipo:v.tipo||'geral', formato:v.formato||'1:1', caption:v.caption||'', created:v.created||0}; }catch{ return null; } }).filter(Boolean).sort((a,b)=>b.created-a.created); cb(lista); }; }; }
function openVideo(id){ const post=allVideosCache.find(p=>p.id===id); if(!post) return; const vEl=document.getElementById('modalVideo'); const iEl=document.getElementById('modalImage'); if(post.isVideo){ iEl.style.display='none'; vEl.style.display='block'; vEl.src=post.src; }else{ vEl.style.display='none'; iEl.style.display='block'; iEl.src=post.src; } document.getElementById('modalCaption').innerText=post.caption+' • '+post.formato; document.getElementById('videoModal').style.display='flex'; }
function renderUserPosts(filter='todos'){ const grid=document.getElementById('userPostsGrid'); const empty=document.getElementById('emptyState'); const count=document.getElementById('postsCount'); let filtered=allVideosCache; if(filter==='virais') filtered=allVideosCache.filter(p=>p.tipo==='viral'); if(filter==='geral') filtered=allVideosCache.filter(p=>p.tipo==='geral'); if(count) count.textContent=allVideosCache.length; if(filtered.length===0 && allVideosCache.length===0){ empty.style.display='flex'; grid.style.display='none'; return; } empty.style.display='none'; grid.style.display='grid'; grid.innerHTML=filtered.map(post=>`<div class="post-grid-item" onclick="openVideo('${post.id}')"><button class="btn-delete-post" onclick="event.stopPropagation(); deletePost('${post.id}')">X</button>${post.isVideo?`<video src="${post.src}" muted playsinline></video>`:`<img src="${post.src}">`}<div class="badge-formato">${post.formato} ${post.tipo==='viral'?'🔥':''} ${post.isVideo?'▶':''}</div></div>`).join(''); }
function deletePost(id){ if(!confirm('Excluir?')) return; const req=indexedDB.open('KoneatDB',1); req.onsuccess=(e)=>{ const db=e.target.result; const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').delete(id); tx.oncomplete=()=>carregarDoDB(v=>{ allVideosCache=v; renderUserPosts(document.querySelector('.tab-btn.active')?.dataset.tab||'todos'); }); }; }
document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderUserPosts(btn.dataset.tab); }));
carregarDoDB(v=>{ allVideosCache=v; renderUserPosts('todos'); });
</script>
</body>
    </html>
