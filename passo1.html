<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Koneat - Perfil</title><link rel="stylesheet" href="css/style.css">
<style>
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;background:#fff}
.bottom-nav-fixed{position:fixed;bottom:0;left:0;right:0;width:100%;height:62px;background:#121214;border-top-left-radius:20px;border-top-right-radius:20px;display:flex;align-items:center;justify-content:space-around;z-index:999;padding:0 10px}
.nav-link{background:none;border:none;cursor:pointer;color:#8e8e93;display:flex;align-items:center;justify-content:center;width:48px;height:48px;text-decoration:none}
.profile-active-circle{width:32px;height:32px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px 0 80px 0;width:100%}
.post-grid-item{position:relative;width:100%;aspect-ratio:1/1;background:#222;overflow:hidden}
.post-grid-item img,.post-grid-item video{width:100%;height:100%;object-fit:cover}
.post-text-tile{width:100%;height:100%;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center;background:#1c1c1e;color:#fff;font-size:12px}
.badge-video{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.6);padding:3px;border-radius:4px}
.btn-delete-post{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.7);border:none;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10}
</style></head>
<body class="light-theme">
<div class="app-container" style="padding-bottom:70px">
<header class="profile-header"><div style="font-size:20px;font-weight:700;text-transform:lowercase">koneat_user</div></header>
<section style="display:flex;gap:20px;padding:20px;align-items:center"><div style="width:80px;height:80px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8e8e93"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div><div style="display:flex;gap:20px"><div><b id="postsCount">0</b> posts</div><div><b>0</b> seguidores</div><div><b>0</b> seguindo</div></div></section>
<section id="emptyState" style="display:flex;flex-direction:column;align-items:center;padding:40px"><h2>Capture o momento com um amigo</h2><a href="./criar.html" style="background:#000;color:#fff;padding:12px 20px;border-radius:20px;text-decoration:none">Crie seu primeiro post</a></section>
<div class="posts-grid" id="userPostsGrid" style="display:none"></div>
</div>
<nav class="bottom-nav-fixed">
<a href="./home.html" class="nav-link">🏠</a><a href="./criar.html" class="nav-link">＋</a><a href="./passo2.html" class="nav-link">🎬</a><a href="./passo1.html" class="nav-link"><div class="profile-active-circle">👤</div></a>
</nav>
<script>
function koneatMediaUrl(p){return (p&&(p.url||p.videoUrl||p.video||p.image||p.foto))||''}
function koneatIsVideo(p){if(!p)return false;const t=String(p.type||'').toLowerCase();if(t==='video')return true;return String(p.url||'').startsWith('data:video')||/\.(mp4|webm|mov)/i.test(p.url||'')}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('koneat_db',1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('posts'))db.createObjectStore('posts',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getAllFromIDB(){try{const db=await openDB();return await new Promise((res,rej)=>{const tx=db.transaction('posts','readonly');const req=tx.objectStore('posts').getAll();req.onsuccess=()=>res(req.result||[]);req.onerror=()=>rej(req.error)})}catch(e){return []}}
async function renderUserPosts(){
const idb=await getAllFromIDB();const all=[...idb,...JSON.parse(localStorage.getItem('koneat_virais_feed')||'[]'),...JSON.parse(localStorage.getItem('koneat_posts')||'[]'),...JSON.parse(localStorage.getItem('koneat_user_posts')||'[]')];
const seen=new Set();const posts=all.filter(p=>{const k=p.id||koneatMediaUrl(p);if(!k||seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>(b.time||0)-(a.time||0));
document.getElementById('postsCount').textContent=posts.length;
const grid=document.getElementById('userPostsGrid'),empty=document.getElementById('emptyState');
if(posts.length===0){empty.style.display='flex';grid.style.display='none';return}
empty.style.display='none';grid.style.display='grid';
grid.innerHTML=posts.map(p=>{const isV=koneatIsVideo(p),url=koneatMediaUrl(p);return `<div class="post-grid-item"><button class="btn-delete-post" onclick="deletePost('${p.id}')">🗑</button>${isV&&url?`<video src="${url}" muted playsinline></video><div class="badge-video">▶</div>`:url?`<img src="${url}">`:`<div class="post-text-tile">${p.caption||'Post'}</div>`}</div>`}).join('')
}
async function deletePost(id){if(!confirm('Excluir?'))return;try{const db=await openDB();const tx=db.transaction('posts','readwrite');tx.objectStore('posts').delete(id)}catch(e){}['koneat_user_posts','koneat_posts','koneat_virais_feed'].forEach(k=>{let a=JSON.parse(localStorage.getItem(k)||'[]');a=a.filter(p=>p.id!==id);localStorage.setItem(k,JSON.stringify(a))});renderUserPosts()}
renderUserPosts();
</script></body></html>
