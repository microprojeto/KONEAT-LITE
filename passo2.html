<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneat - Vídeos Virais</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.dark-video-theme{background:#000;color:#fff;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;width:100vw;height:100vh}
        .reels-feed-container{width:100vw;height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
        .reels-feed-container::-webkit-scrollbar{display:none}
        .video-header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:50;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,0.08)}
        .video-header-title{font-size:18px;font-weight:700;color:#fff;margin:0}
        .header-actions-right{display:flex;align-items:center;gap:16px}
        .icon-btn-top{background:none;border:none;cursor:pointer;color:#fff;padding:4px}
        .empty-feed-wrapper{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8e8e93;font-size:15px;font-weight:500;text-align:center;gap:16px}
        .reel-card{width:100vw;height:100vh;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
        .reel-video-element{width:100%;height:100%;object-fit:cover;cursor:pointer}
        .reel-video-element[data-formato="16:9"]{object-fit:contain;background:#000}
        .bottom-nav-fixed{position:fixed;bottom:0;left:0;right:0;width:100%;height:62px;background:#121214;border-top-left-radius:20px;border-top-right-radius:20px;display:flex;align-items:center;justify-content:space-around;z-index:999;box-sizing:border-box;padding:0 10px}
        .nav-link{background:none;border:none;cursor:pointer;color:#8e8e93;display:flex;align-items:center;justify-content:center;text-decoration:none;width:48px;height:48px}
        .nav-link.active-video{color:#fff}
    </style>
</head>
<body class="dark-video-theme">
    <header class="video-header" id="mainHeader"><h1 class="video-header-title">Virais</h1><div class="header-actions-right"><button class="icon-btn-top">⌕</button><button class="icon-btn-top" id="menuDecisionsBtn">☰</button></div></header>
    <main class="reels-feed-container" id="reelsContainer"></main>
    <nav class="bottom-nav-fixed">
        <a href="./home.html" class="nav-link">⌂</a><a href="./criar.html" class="nav-link">+</a><a href="./passo2.html" class="nav-link active-video">▶</a><a href="./passo1.html" class="nav-link">◉</a>
    </nav>
<script>
const reelsContainer=document.getElementById('reelsContainer');
function renderViraisFeed(){
  const req=indexedDB.open('KoneatDB',1);
  req.onupgradeneeded=(e)=>{ if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id'}); };
  req.onsuccess=(e)=>{
    const db=e.target.result; if(!db.objectStoreNames.contains('videos')){ reelsContainer.innerHTML='<div class="empty-feed-wrapper">Nenhum vídeo</div>'; return; }
    const tx=db.transaction('videos','readonly'); const all=tx.objectStore('videos').getAll();
    all.onsuccess=()=>{
      const viraisFeed = all.result.filter(v=>v.tipo==='viral').sort((a,b)=>b.created-a.created);
      if(viraisFeed.length===0){
        reelsContainer.innerHTML=`<div class="empty-feed-wrapper"><span>Os vídeos virais aparecerão aqui.</span><span style="font-size:13px;">Poste selecionando VIRAIS no topo</span><a href="./criar.html" style="background:#fff;color:#000;padding:10px 18px;border-radius:20px;text-decoration:none;font-weight:700;margin-top:10px;">Criar primeiro vídeo</a></div>`;
        return;
      }
      reelsContainer.innerHTML=viraisFeed.map((item)=>{
        const url=URL.createObjectURL(item.file);
        return `<article class="reel-card" data-formato="${item.formato}">
          <video class="reel-video-element" data-formato="${item.formato}" src="${url}" loop muted playsinline autoplay></video>
          <div style="position:absolute;bottom:80px;left:16px;display:flex;flex-direction:column;gap:8px"><span style="font-weight:700">@koneat_user • ${item.formato} 🔥</span><span style="font-size:13px">${item.caption||''}</span></div>
        </article>`;
      }).join('');
      const observer=new IntersectionObserver((entries)=>{ entries.forEach(en=>{ const v=en.target.querySelector('video'); if(en.isIntersecting){ v.play().catch(()=>{}); }else{ v.pause(); } }); },{threshold:0.7});
      document.querySelectorAll('.reel-card').forEach(c=>observer.observe(c));
    };
  };
}
renderViraisFeed();
</script>
<script src="js/app.js"></script>
</body>
</html>
