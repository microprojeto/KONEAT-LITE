<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Koneat - Vídeos Virais</title>
<style>
body.dark-video-theme{background:#000;color:#fff;margin:0;padding:0;overflow:hidden;width:100vw;height:100vh;font-family:sans-serif}
.reels-feed-container{width:100vw;height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels-feed-container::-webkit-scrollbar{display:none}
.video-header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:50;background:rgba(0,0,0,0.85)}
.empty-feed-wrapper{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8e8e93;gap:16px;text-align:center}
.reel-card{width:100vw;height:100vh;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
.reel-video-element{width:100%;height:100%;object-fit:contain;background:#000}
.bottom-nav-fixed{position:fixed;bottom:0;left:0;right:0;width:100%;height:62px;background:#121214;border-top-left-radius:20px;border-top-right-radius:20px;display:flex;align-items:center;justify-content:space-around;z-index:999}
.nav-link{color:#8e8e93;text-decoration:none;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.nav-link.active-video{color:#fff}
</style>
</head>
<body class="dark-video-theme">
<header class="video-header"><h1 style="font-size:18px;font-weight:700;margin:0">Virais - só vídeo</h1></header>
<main class="reels-feed-container" id="reelsContainer"></main>
<nav class="bottom-nav-fixed"><a href="./home.html" class="nav-link">⌂</a><a href="./criar.html" class="nav-link">+</a><a href="./passo2.html" class="nav-link active-video">▶</a><a href="./passo1.html" class="nav-link">◉</a></nav>
<script>
const reelsContainer=document.getElementById('reelsContainer');
function renderViraisFeed(){
  const req=indexedDB.open('KoneatDB',1);
  req.onupgradeneeded=(e)=>{ if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id'}); };
  req.onsuccess=(e)=>{
    const db=e.target.result; if(!db.objectStoreNames.contains('videos')){ reelsContainer.innerHTML='<div class="empty-feed-wrapper">Nenhum vídeo</div>'; return; }
    const tx=db.transaction('videos','readonly'); const all=tx.objectStore('videos').getAll();
    all.onsuccess=()=>{
      // CORREÇÃO PRINCIPAL: pega todos os vídeos do banco, independente de ser POST ou VIRAIS
      // Só ignora fotos
      const todosVideos = all.result.filter(v=>v.file && v.file.type.startsWith('video')).sort((a,b)=>b.created-a.created);
      if(todosVideos.length===0){
        reelsContainer.innerHTML=`<div class="empty-feed-wrapper"><span>Poste vídeos no painel do perfil que eles aparecem aqui em tela cheia.</span><a href="./criar.html" style="background:#fff;color:#000;padding:10px 18px;border-radius:20px;text-decoration:none;font-weight:700;margin-top:10px;">Criar vídeo</a></div>`;
        return;
      }
      reelsContainer.innerHTML=todosVideos.map((item)=>{
        const url=URL.createObjectURL(item.file);
        return `<article class="reel-card"><video class="reel-video-element" src="${url}" loop playsinline autoplay muted controls></video><div style="position:absolute;bottom:85px;left:16px;color:#fff;text-shadow:0 2px 4px #000"><b>@user • ${item.formato} ${item.tipo==='viral'?'🔥':''}</b><br><span style="font-size:13px">${item.caption||''}</span></div></article>`;
      }).join('');
      const obs=new IntersectionObserver((entries)=>{ entries.forEach(en=>{ const v=en.target.querySelector('video'); if(en.isIntersecting){ v.play().catch(()=>{}); }else{ v.pause(); } }); },{threshold:0.6});
      document.querySelectorAll('.reel-card').forEach(c=>obs.observe(c));
      // Se tem vídeo, já toca o primeiro
      const first=document.querySelector('.reel-card video'); if(first) first.play().catch(()=>{});
    };
  };
}
renderViraisFeed();
</script>
</body>
</html>
