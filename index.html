<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Koneat Lite - Login</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* DETALHES DE LINHAS BRANCAS LUMINOSAS NOS CANTOS */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            pointer-events: none;
            opacity: 0.25;
        }

        body::before {
            top: -100px;
            left: -100px;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            border-bottom-right-radius: 100%;
            box-shadow: inset -1px -1px 2px rgba(255,255,255,0.3);
        }

        body::after {
            bottom: -100px;
            right: -100px;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            border-top-left-radius: 100%;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.3);
        }

        /* CONTAINER PRINCIPAL DO LOGIN */
        .app-screen {
            width: 100%;
            max-width: 390px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            padding: 24px 24px 44px 24px;
            position: relative;
            z-index: 1;
            gap: 16px; 
        }

        /* TOPO: LOGO E TÍTULOS */
        .logo-area {
            text-align: center;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            line-height: 1;
        }

        .subtitle {
            font-size: 10px;
            letter-spacing: 3px;
            color: #8e8e93;
            margin-top: 6px;
            text-transform: uppercase;
        }

        /* FORMULÁRIO E CAMPOS TIPO PÍLULA */
        .form-container {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .input-group {
            width: 100%;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 13px;
            font-weight: 400;
            color: #ffffff;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 23px;
            display: flex;
            align-items: center;
            padding: 0 16px;
        }

        .input-wrapper:focus-within {
            border-color: #ffffff;
        }

        .input-field {
            width: 100%;
            background: none;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: #8e8e93;
        }

        /* BOTÃO DE OLHO (SÓ NO CAMPO SENHA) */
        .toggle-password {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8e8e93;
            transition: color 0.2s ease;
        }

        .toggle-password:hover, .toggle-password:active {
            color: #ffffff;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        /* BOTÃO ENTRAR PÍLULA BRANCA COM ESPAÇAMENTO MAIOR (34px) */
        .btn-submit {
            width: 100%;
            height: 46px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 23px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            margin-top: 34px;
            letter-spacing: 0.5px;
        }

        /* DIVISOR OU */
        .divider-container {
            width: 100%;
            display: flex;
            align-items: center;
            margin: 14px 0;
            color: #8e8e93;
            font-size: 13px;
        }

        .divider-container::before,
        .divider-container::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.25);
        }

        .divider-container span {
            padding: 0 12px;
        }

        /* BOTÃO GOOGLE COM BORDAS MAIS VISÍVEIS */
        .btn-google {
            width: 100%;
            height: 46px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 23px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .google-icon-wrapper {
            display: flex;
            align-items: center;
            padding-right: 12px;
            border-right: 1px solid rgba(255, 255, 255, 0.35);
            margin-right: 12px;
        }

        /* LINKS LOGO ABAIXO DO GOOGLE EM UMA ÚNICA LINHA */
        .footer-links {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            font-size: 13px;
            margin-top: 8px;
        }

        .footer-link {
            color: #8e8e93;
            text-decoration: underline;
            text-underline-offset: 4px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .footer-link:active, .footer-link:hover {
            color: #ffffff;
        }

        .footer-dot {
            color: #8e8e93;
            font-size: 12px;
            user-select: none;
        }

        /* RODAPÉ SYSTENDANCE FIXO NA BASE DA TELA */
        .systendance-copy {
            position: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: #8e8e93;
            letter-spacing: 0.5px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <!-- TOPO -->
        <div class="logo-area">
            <h1 class="logo-text">KONEΛT</h1>
            <div class="subtitle">O COMEÇO</div>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div class="form-container">
            <form id="loginForm">
                <div class="input-group">
                    <label class="input-label" for="emailField">E-mail</label>
                    <div class="input-wrapper">
                        <input type="email" id="emailField" class="input-field" placeholder="Digite seu e-mail." required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="passwordField">Senha</label>
                    <div class="input-wrapper">
                        <input type="text" id="passwordField" class="input-field" placeholder="Digite sua senha." required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassBtn" aria-label="Alternar senha">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    ENTRAR 
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <div class="divider-container">
                <span>Ou</span>
            </div>

            <button type="button" class="btn-google" id="btnGoogle">
                <div class="google-icon-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.36 7.25 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.81 0 12s.43 3.9 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.25 0 3.17 2.64 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                </div>
                Entrar com Google
            </button>
        </div>

        <!-- LINKS DE CADASTRO E RECUPERAÇÃO EM UMA LINHA -->
        <div class="footer-links">
            <a id="btnSignUp" class="footer-link">Criar nova conta</a>
            <span class="footer-dot">•</span>
            <a id="btnForgot" class="footer-link">Recuperar acesso</a>
        </div>

        <!-- RODAPÉ FIXO NA BASE DA TELA -->
        <p class="systendance-copy">© 2027 Systendance.</p>
    </div>

    <script>
        /* ===============================================================
           LÓGICA INTELIGENTE DO CAMPO DE SENHA E OLHO
           =============================================================== */
        const passwordField = document.getElementById('passwordField');
        const togglePassBtn = document.getElementById('togglePassBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        const openEyeSVG = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        const closedEyeSVG = `<line x1="1" y1="1" x2="23" y2="23"></line><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>`;

        let userManuallyToggled = false;

        passwordField.addEventListener('input', () => {
            if (passwordField.value.length > 0 && !userManuallyToggled) {
                passwordField.setAttribute('type', 'password');
                eyeIcon.innerHTML = closedEyeSVG;
            } else if (passwordField.value.length === 0) {
                userManuallyToggled = false;
                passwordField.setAttribute('type', 'text');
                eyeIcon.innerHTML = openEyeSVG;
            }
        });

        togglePassBtn.addEventListener('click', () => {
            userManuallyToggled = true;
            const isPassword = passwordField.getAttribute('type') === 'password';
            passwordField.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.innerHTML = isPassword ? openEyeSVG : closedEyeSVG;
        });

        /* ===============================================================
           EVENTOS DOS BOTÕES E LINKS
           =============================================================== */
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('emailField').value.trim();
            const password = passwordField.value;

            if (!email || !password) {
                alert('Preencha o e-mail e a senha.');
                return;
            }
            
            window.location.href = 'passo1.html';
        });

        document.getElementById('btnGoogle').addEventListener('click', () => {
            window.location.href = 'passo1.html';
        });

        document.getElementById('btnSignUp').addEventListener('click', () => {
            window.location.href = 'cadastro.html';
        });

        document.getElementById('btnForgot').addEventListener('click', () => {
            window.location.href = 'recuperar.html';
        });
    </script>
</body>
</html>
