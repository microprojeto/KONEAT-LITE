<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneat Lite - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Container Principal do Login -->
    <main class="login-container">
        <!-- Logo e Títulos Premium -->
        <div class="logo-area">
            <h1 class="logo-text">K.</h1>
            <h2 class="brand-name">KONEΛT <span>LITE</span></h2>
            <p class="subtitle">O COMEÇO</p>
        </div>

        <!-- Formulário de Login -->
        <form action="passo1.html" method="GET" class="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail." required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha." required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar Senha">
                        <svg class="eye-icon" id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                ENTRAR <span>→</span>
            </button>
        </form>

        <div class="divider">
            <span>Ou</span>
        </div>

        <!-- Botão Google -->
        <button type="button" class="btn-google">
            <div class="google-icon-wrapper">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
            </div>
            <span class="google-divider"></span>
            <span class="google-text">Entrar com Google</span>
        </button>

        <!-- Links Úteis Organizados em Linhas Corretas -->
        <footer class="login-footer">
            <div class="footer-row">
                <span>Não tem conta?</span> <a href="cadastro.html">Fazer cadastro</a>
            </div>
            <div class="footer-row">
                <span>Esqueceu sua senha?</span> <a href="recuperar.html">Recuperar acesso</a>
            </div>
        </footer>
    </main>

    <script src="js/app.js"></script>
</body>
  </html>
