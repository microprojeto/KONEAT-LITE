<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koneat - Criar</title><link rel="stylesheet" href="css/style.css">
<style>
body.dark-create-theme{background:#000;color:#fff;margin:0;font-family:sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;justify-content:space-between}
.create-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#000;border-bottom:1px solid rgba(255,255,255,0.08)}
.btn-close{background:none;border:none;color:#fff;cursor:pointer}
.type-selector-tabs{display:flex;gap:16px}.type-tab{background:none;border:none;color:#8e8e93;font-size:14px;font-weight:700;cursor:pointer;text-transform:uppercase;padding:4px 0}.type-tab.active{color:#fff;border-bottom:2px solid #fff}
.btn-advance-top{background:transparent;color:#8e8e93;border:none;font-size:15px;font-weight:700;cursor:not-allowed;padding:6px 12px}.btn-advance-top.active{color:#00ff88;cursor:pointer}
.gallery-controls-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.icon-circle-btn{width:36px;height:36px;border-radius:50%;background:#262626;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.create-preview-area{flex:1;display:flex;align-items:center;justify-content:center;color:#8e8e93;font-size:16px;font-weight:600;cursor:pointer;position:relative;overflow:hidden;background:#000}
.create-preview-area video,.create-preview-area img{width:100%;height:100%;object-fit:contain}
.caption-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:100;display:none;flex-direction:column;padding:20px}.caption-modal.show{display:flex}
.caption-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.caption-header h2{font-size:18px;margin:0}
.btn-back-caption,.btn-publish-final{background:none;border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer}.btn-publish-final{color:#00ff88}
.caption-body{display:flex;gap:16px}.caption-thumbnail{width:84px;height:84px;border-radius:12px;object-fit:cover;background:#222}
.caption-textarea{flex:1;height:120px;background:transparent;border:none;color:#fff;font-size:15px;resize:none;outline:none}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center}.loading-overlay.show{display:flex}
.loading-box{background:#18181b;border:1px solid rgba(255,255,255,0.1);padding:24px 28px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,0.2);border-top-color:#00ff88;border-radius:50%;animation:spin 0.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style></head>
<body class="dark-create-theme">
<header class="create-header">
<a href="./passo1.html" class="btn-close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></a>
<div class="type-selector-tabs"><button class="type-tab active" data-type="post">POST</button><button class="type-tab" data-type="story">STORY</button><button class="type-tab" data-type="virais">VIRAIS</button></div>
<button class="btn-advance-top" id="btnAdvance">Avançar</button>
</header>
<div class="gallery-controls-bar"><button class="btn-gallery-dropdown">Galeria</button><div style="display:flex;gap:12px"><button class="icon-circle-btn" id="openCameraBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></button></div></div>
<main class="create-preview-area" id="previewContainer"><span id="previewText">Crie um post</span></main>
<div class="caption-modal" id="captionModal"><div class="caption-header"><button id="closeModalBtn" class="btn-back-caption">Voltar</button><h2>Nova publicação</h2><button id="publishFinalBtn" class="btn-publish-final">Compartilhar</button></div><div class="caption-body"><img id="modalThumbnail" class="caption-thumbnail"><textarea id="postCaptionInput" class="caption-textarea" placeholder="Escreva uma legenda..."></textarea></div></div>
<div class="loading-overlay" id="loadingOverlay"><div class="loading-box"><div class="spinner"></div><span>Sua publicação está sendo postada</span></div></div>
<input type="file" id="fileInput" accept="image/*,video/*" style="display:none;">
<script>
let mediaDataUrl=null, mediaType=null;
const previewText=document.getElementById('previewText'), fileInput=document.getElementById('fileInput'), previewContainer=document.getElementById('previewContainer'), btnAdvance=document.getElementById('btnAdvance'), openCameraBtn=document.getElementById('openCameraBtn'), captionModal=document.getElementById('captionModal'), closeModalBtn=document.getElementById('closeModalBtn'), publishFinalBtn=document.getElementById('publishFinalBtn'), modalThumbnail=document.getElementById('modalThumbnail'), postCaptionInput=document.getElementById('postCaptionInput'), loadingOverlay=document.getElementById('loadingOverlay');
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('koneat_db',1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('posts'))db.createObjectStore('posts',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveToIDB(post){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('posts','readwrite');tx.objectStore('posts').put(post);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
document.querySelectorAll('.type-tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.type-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');previewText.textContent=tab.dataset.type==='post'?'Crie um post':tab.dataset.type==='story'?'Crie um story':'Crie um vídeo viral'})});
previewContainer.addEventListener('click',()=>fileInput.click());openCameraBtn.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(file.size>100*1024*1024){alert('Vídeo muito grande! Máx 100MB');return}const reader=new FileReader();reader.onload=ev=>{mediaDataUrl=ev.target.result;mediaType=file.type.startsWith('video')?'video':'image';previewContainer.innerHTML=mediaType==='video'?`<video src="${mediaDataUrl}" controls autoplay playsinline style="width:100%;height:100%;object-fit:contain"></video>`:`<img src="${mediaDataUrl}" style="width:100%;height:100%;object-fit:contain"/>`;modalThumbnail.src=mediaDataUrl;btnAdvance.classList.add('active')};reader.readAsDataURL(file)});
btnAdvance.addEventListener('click',()=>{if(mediaDataUrl)captionModal.classList.add('show')});closeModalBtn.addEventListener('click',()=>captionModal.classList.remove('show'));
publishFinalBtn.addEventListener('click',async()=>{
if(!mediaDataUrl)return;loadingOverlay.classList.add('show');
const postData={id:'post_'+Date.now(),url:mediaDataUrl,video:mediaType==='video'?mediaDataUrl:'',type:mediaType,caption:postCaptionInput.value.trim(),time:Date.now(),author:'Eributtler'};
try{await saveToIDB(postData);try{let a=JSON.parse(localStorage.getItem('koneat_virais_feed')||'[]');a.unshift(postData);localStorage.setItem('koneat_virais_feed',JSON.stringify(a.slice(0,20)))}catch(e){}}catch(err){alert('Erro: '+err.message);loadingOverlay.classList.remove('show');return}
loadingOverlay.classList.remove('show');window.location.href=mediaType==='video'?'./passo2.html':'./passo1.html';
});
</script></body></html>
